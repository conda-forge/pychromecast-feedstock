schema_version: 1

context:
  version: "14.1.0"
  python_min: "3.11"

package:
  name: pychromecast
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pychromecast/pychromecast-${{ version }}.tar.gz
  sha256: 17f672c5ccf8aa3ccb6ba261e51d60224d28efcc0f225c8d2ec0509eeda52efd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - protobuf >=4.25.1
    - zeroconf >=0.25.1
    - casttube >=0.2.0

tests:
  - python:
      pip_check: false # https://github.com/conda-forge/zeroconf-feedstock/pull/130
      imports:
        - pychromecast
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python module to talk to Google Chromecast.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/balloob/pychromecast

extra:
  recipe-maintainers:
    - pavelzw
